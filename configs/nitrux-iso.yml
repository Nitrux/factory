iso:
  rootfs:
    url: https://github.com/Nitrux/nbs/releases/latest/download/rootfs.tar.xz
    sha256_url: https://github.com/Nitrux/nbs/releases/latest/download/rootfs.tar.xz.sha256
  output_dir: build-artifacts
  image: nitrux-mesa-amd64.iso
  volume_label: NITRUX
  flavor: mesa
  prepare_host: true
  stages:
    - 01-add-build-sources
    - 02-remove-systemd-packages
    - 03-install-bootloader
    - 04-install-kernel
    - 05-install-openrc
    - 06-install-casper
    - 07-install-bootsplash
    - 08-install-nitrux-base
    - 09-install-hardware-support
    - 10-install-nvidia-drivers
    - 11-install-desktop-session
    - 12-install-calamares
    - 13-install-init-config
    - 14-add-live-user
    - 15-update-initram-config
    - 16-remove-build-sources
    - 17-add-misc-fixes
    - 18-edit-conf-files
    - 19-manual-checks
    - 20-create-var-archive
  squashfs:
    compression: zstd
    level: 18
    block_size: 262144
    memory: 4G
